<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title>How a typhoon forms</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2937"/></marker><pattern id="crop" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="10" height="10" fill="#ecfccb"/><line x1="0" y1="0" x2="0" y2="10" stroke="#a3e635" stroke-width="3"/></pattern><pattern id="paving" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#f3e8d2"/><path d="M0 0 H14 M0 7 H14 M7 0 V7 M0 7 V14 M14 7 V14" stroke="#e2d2b1" stroke-width="1"/></pattern><pattern id="water" width="24" height="10" patternUnits="userSpaceOnUse"><rect width="24" height="10" fill="#9cc9f5"/><path d="M0 6 q6 -4 12 0 t12 0" fill="none" stroke="#7fb5ea" stroke-width="1.2"/></pattern><pattern id="grass" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#d9f2c4"/><path d="M3 9 l1 -3 M8 5 l1 -3" stroke="#a7d98a" stroke-width="1.2"/></pattern><pattern id="sand" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f4e4b8"/><circle cx="3" cy="3" r="0.8" fill="#d9c189"/><circle cx="8" cy="7" r="0.8" fill="#d9c189"/></pattern></defs><rect width="980" height="500" fill="#ffffff"/><text x="490.0" y="40.0" font-size="21" fill="#1f2937" text-anchor="middle" font-weight="bold">How a typhoon forms</text><rect x="35.0" y="84.0" width="270" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="51.0" cy="100.0" r="12" fill="#0f766e"/><text x="51.0" y="104.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">1</text><g transform="translate(170.0,126.0) scale(0.95)"><circle r="9" fill="#f6b73c" stroke="#d98e04" stroke-width="1.5"/><line x1="13.0" y1="0.0" x2="19.0" y2="0.0" stroke="#d98e04" stroke-width="2.2" stroke-linecap="round"/><line x1="9.2" y1="9.2" x2="13.4" y2="13.4" stroke="#d98e04" stroke-width="2.2" stroke-linecap="round"/><line x1="0.0" y1="13.0" x2="0.0" y2="19.0" stroke="#d98e04" stroke-width="2.2" stroke-linecap="round"/><line x1="-9.2" y1="9.2" x2="-13.4" y2="13.4" stroke="#d98e04" stroke-width="2.2" stroke-linecap="round"/><line x1="-13.0" y1="0.0" x2="-19.0" y2="0.0" stroke="#d98e04" stroke-width="2.2" stroke-linecap="round"/><line x1="-9.2" y1="-9.2" x2="-13.4" y2="-13.4" stroke="#d98e04" stroke-width="2.2" stroke-linecap="round"/><line x1="-0.0" y1="-13.0" x2="-0.0" y2="-19.0" stroke="#d98e04" stroke-width="2.2" stroke-linecap="round"/><line x1="9.2" y1="-9.2" x2="13.4" y2="-13.4" stroke="#d98e04" stroke-width="2.2" stroke-linecap="round"/></g><text x="170.0" y="164.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Warm ocean</text><text x="170.0" y="181.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Sun heats the sea</text><text x="170.0" y="196.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">surface to above 26.5°C</text><line x1="308.0" y1="159.0" x2="351.0" y2="159.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/><rect x="355.0" y="84.0" width="270" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="371.0" cy="100.0" r="12" fill="#0f766e"/><text x="371.0" y="104.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">2</text><g transform="translate(490.0,126.0) scale(0.95)"><path d="M-10 16 L-10 -12" stroke="#ef4444" stroke-width="2.4" marker-end="url(#ar)"/><path d="M0 16 L0 -12" stroke="#ef4444" stroke-width="2.4" marker-end="url(#ar)"/><path d="M10 16 L10 -12" stroke="#ef4444" stroke-width="2.4" marker-end="url(#ar)"/></g><text x="490.0" y="164.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Rising air</text><text x="490.0" y="181.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Warm, moist air</text><text x="490.0" y="196.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">rises from the ocean</text><line x1="628.0" y1="159.0" x2="671.0" y2="159.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/><rect x="675.0" y="84.0" width="270" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="691.0" cy="100.0" r="12" fill="#0f766e"/><text x="691.0" y="104.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">3</text><g transform="translate(810.0,126.0) scale(0.95)"><path d="M-16 6 a8 8 0 0 1 2 -15 a10 10 0 0 1 18 -3 a8 8 0 0 1 12 9 a6 6 0 0 1 0 9 Z" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/></g><text x="810.0" y="164.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Cloud formation</text><text x="810.0" y="181.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Water vapour condenses</text><text x="810.0" y="196.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">into tall clouds,</text><text x="810.0" y="212.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">releasing heat</text><line x1="810.0" y1="237.0" x2="810.0" y2="310.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/><rect x="675.0" y="314.0" width="270" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="691.0" cy="330.0" r="12" fill="#0f766e"/><text x="691.0" y="334.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">4</text><g transform="translate(810.0,356.0) scale(0.95)"><circle r="5" fill="#2a78d6"/><line x1="14.1" y1="14.1" x2="6.4" y2="6.4" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/><line x1="-14.1" y1="14.1" x2="-6.4" y2="6.4" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/><line x1="-14.1" y1="-14.1" x2="-6.4" y2="-6.4" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/><line x1="14.1" y1="-14.1" x2="6.4" y2="-6.4" stroke="#374151" stroke-width="2" marker-end="url(#ar)"/></g><text x="810.0" y="394.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Low pressure</text><text x="810.0" y="411.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Pressure falls at the</text><text x="810.0" y="426.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">surface and more air</text><text x="810.0" y="442.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">is drawn in</text><line x1="672.0" y1="389.0" x2="629.0" y2="389.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/><rect x="355.0" y="314.0" width="270" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="371.0" cy="330.0" r="12" fill="#0f766e"/><text x="371.0" y="334.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">5</text><g transform="translate(490.0,356.0) scale(0.95)"><polyline points="1.5,0.0 1.7,0.6 1.7,1.3 1.4,2.0 0.8,2.7 -0.1,3.1 -1.2,3.2 -2.3,2.9 -3.4,2.2 -4.2,1.1 -4.7,-0.3 -4.7,-1.9 -4.1,-3.4 -3.0,-4.8 -1.4,-5.8 0.6,-6.3 2.6,-6.1 4.6,-5.2 6.3,-3.6 7.4,-1.5 7.8,0.9 7.4,3.5 6.2,5.9 4.2,7.8 1.6,9.0 -1.4,9.4 -4.4,8.8 -7.2,7.2 -9.4,4.7 -10.7,1.6 -10.9,-1.9 -10.0,-5.4 -8.1,-8.5 -5.1,-10.9 -1.4,-12.3 2.6,-12.4 6.5,-11.3 10.0,-8.9 12.5,-5.4 13.9,-1.2 13.9,3.3 12.4,7.7 9.6,11.5 5.6,14.2 0.9,15.6 -4.1,15.4 -8.9,13.5 -13.0,10.2 -15.8,5.7 -17.2,0.5 -16.8,-5.0 -14.6,-10.2 -10.8,-14.6 -5.8,-17.5 0.0,-18.8 6.0,-18.1 11.6,-15.6 16.2,-11.3 19.2,-5.7 20.4,0.6" fill="none" stroke="#6250d6" stroke-width="2.6"/><circle r="3" fill="#fff" stroke="#6250d6"/></g><text x="490.0" y="394.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Rotation</text><text x="490.0" y="411.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Earth's rotation makes</text><text x="490.0" y="426.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">the storm spin and</text><text x="490.0" y="442.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">an eye forms</text><line x1="352.0" y1="389.0" x2="309.0" y2="389.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/><rect x="35.0" y="314.0" width="270" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="51.0" cy="330.0" r="12" fill="#0f766e"/><text x="51.0" y="334.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">6</text><g transform="translate(170.0,356.0) scale(0.95)"><path d="M-20 -6 L8 -6 a5 5 0 1 0 -5 -5" fill="none" stroke="#6b7280" stroke-width="2.4"/><path d="M-20 4 L14 4 a5 5 0 1 1 -5 5" fill="none" stroke="#6b7280" stroke-width="2.4"/></g><text x="170.0" y="394.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Landfall</text><text x="170.0" y="411.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Strong winds and rain</text><text x="170.0" y="426.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">hit the coast; the storm</text><text x="170.0" y="442.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">weakens over land</text></svg>