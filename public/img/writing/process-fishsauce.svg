<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 590" width="980" height="590" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title>How traditional fish sauce is made</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2937"/></marker><pattern id="crop" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="10" height="10" fill="#ecfccb"/><line x1="0" y1="0" x2="0" y2="10" stroke="#a3e635" stroke-width="3"/></pattern><pattern id="paving" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#f3e8d2"/><path d="M0 0 H14 M0 7 H14 M7 0 V7 M0 7 V14 M14 7 V14" stroke="#e2d2b1" stroke-width="1"/></pattern><pattern id="water" width="24" height="10" patternUnits="userSpaceOnUse"><rect width="24" height="10" fill="#9cc9f5"/><path d="M0 6 q6 -4 12 0 t12 0" fill="none" stroke="#7fb5ea" stroke-width="1.2"/></pattern><pattern id="grass" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#d9f2c4"/><path d="M3 9 l1 -3 M8 5 l1 -3" stroke="#a7d98a" stroke-width="1.2"/></pattern><pattern id="sand" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f4e4b8"/><circle cx="3" cy="3" r="0.8" fill="#d9c189"/><circle cx="8" cy="7" r="0.8" fill="#d9c189"/></pattern></defs><rect width="980" height="590" fill="#ffffff"/><text x="490.0" y="40.0" font-size="21" fill="#1f2937" text-anchor="middle" font-weight="bold">How traditional fish sauce is made</text><rect x="28.0" y="80.0" width="210" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="44.0" cy="96.0" r="12" fill="#0f766e"/><text x="44.0" y="100.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">1</text><g transform="translate(133.0,122.0) scale(0.95)"><path d="M-16 0 C -8 -10, 8 -10, 14 0 C 8 10, -8 10, -16 0 Z" fill="#7fb5ea" stroke="#2a78d6" stroke-width="1.5"/><path d="M-14 0 L-22 -8 L-22 8 Z" fill="#7fb5ea" stroke="#2a78d6" stroke-width="1.5"/><circle cx="8" cy="-2" r="1.8" fill="#1f2937"/></g><text x="133.0" y="160.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Catching</text><text x="133.0" y="177.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Fresh anchovies</text><text x="133.0" y="192.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">caught at sea</text><line x1="241.0" y1="155.0" x2="270.0" y2="155.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/><rect x="274.0" y="80.0" width="210" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="290.0" cy="96.0" r="12" fill="#0f766e"/><text x="290.0" y="100.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">2</text><g transform="translate(379.0,122.0) scale(0.95)"><path d="M-18 14 L0 -12 L18 14 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><rect x="-6" y="4" width="4" height="4" fill="#cbd5e1" transform="rotate(45 -4 6)"/><rect x="4" y="0" width="4" height="4" fill="#cbd5e1" transform="rotate(45 6 2)"/><rect x="-1" y="-6" width="4" height="4" fill="#cbd5e1" transform="rotate(45 1 -4)"/><rect x="8" y="8" width="4" height="4" fill="#cbd5e1" transform="rotate(45 10 10)"/></g><text x="379.0" y="160.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Salting</text><text x="379.0" y="177.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Mixed with sea salt:</text><text x="379.0" y="192.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">3 parts fish to</text><text x="379.0" y="208.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">1 part salt</text><line x1="487.0" y1="155.0" x2="516.0" y2="155.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/><rect x="520.0" y="80.0" width="210" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="536.0" cy="96.0" r="12" fill="#0f766e"/><text x="536.0" y="100.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">3</text><g transform="translate(625.0,122.0) scale(0.95)"><path d="M-14 -18 Q-19 0 -14 18 L14 18 Q19 0 14 -18 Z" fill="#b7793e" stroke="#7c4a1d" stroke-width="1.5"/><line x1="-16" y1="-8" x2="16" y2="-8" stroke="#4b5563" stroke-width="2.5"/><line x1="-16" y1="8" x2="16" y2="8" stroke="#4b5563" stroke-width="2.5"/></g><text x="625.0" y="160.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Packing</text><text x="625.0" y="177.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Layered in wooden</text><text x="625.0" y="192.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">barrels and pressed</text><text x="625.0" y="208.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">down with weights</text><line x1="733.0" y1="155.0" x2="762.0" y2="155.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/><rect x="766.0" y="80.0" width="210" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="782.0" cy="96.0" r="12" fill="#0f766e"/><text x="782.0" y="100.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">4</text><g transform="translate(871.0,122.0) scale(0.95)"><rect x="-16" y="-14" width="32" height="30" rx="3" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><rect x="-16" y="-14" width="32" height="8" rx="3" fill="#e34948"/><rect x="-11" y="-1" width="5" height="4" fill="#9ca3af"/><rect x="-11" y="6" width="5" height="4" fill="#9ca3af"/><rect x="-3" y="-1" width="5" height="4" fill="#9ca3af"/><rect x="-3" y="6" width="5" height="4" fill="#9ca3af"/><rect x="5" y="-1" width="5" height="4" fill="#9ca3af"/><rect x="5" y="6" width="5" height="4" fill="#9ca3af"/><rect x="13" y="-1" width="5" height="4" fill="#9ca3af"/><rect x="13" y="6" width="5" height="4" fill="#9ca3af"/></g><text x="871.0" y="160.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Fermenting</text><text x="871.0" y="177.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Left to ferment</text><text x="871.0" y="192.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">for 12–18 months</text><line x1="871.0" y1="233.0" x2="871.0" y2="306.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/><rect x="766.0" y="310.0" width="210" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="782.0" cy="326.0" r="12" fill="#0f766e"/><text x="782.0" y="330.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">5</text><g transform="translate(871.0,352.0) scale(0.95)"><rect x="-16" y="-14" width="20" height="8" rx="2" fill="#9ca3af"/><rect x="2" y="-14" width="8" height="16" rx="2" fill="#9ca3af"/><rect x="-10" y="-20" width="8" height="6" fill="#6b7280"/><path d="M6 6 C 9 10, 11 13, 11 15 A5 5 0 0 1 1 15 C 1 13, 3 10, 6 6 Z" fill="#5aa9f0"/></g><text x="871.0" y="390.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Draining</text><text x="871.0" y="407.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Liquid drained from</text><text x="871.0" y="422.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">a tap at the bottom</text><text x="871.0" y="438.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">(first pressing = best)</text><line x1="763.0" y1="385.0" x2="734.0" y2="385.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/><rect x="520.0" y="310.0" width="210" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="536.0" cy="326.0" r="12" fill="#0f766e"/><text x="536.0" y="330.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">6</text><g transform="translate(625.0,352.0) scale(0.95)"><path d="M-18 -14 L18 -14 L4 4 L4 16 L-4 16 L-4 4 Z" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/><line x1="-12" y1="-8" x2="12" y2="-8" stroke="#9ca3af" stroke-dasharray="2 2"/></g><text x="625.0" y="390.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Filtering</text><text x="625.0" y="407.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Filtered to remove</text><text x="625.0" y="422.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">fish particles</text><line x1="517.0" y1="385.0" x2="488.0" y2="385.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/><rect x="274.0" y="310.0" width="210" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="290.0" cy="326.0" r="12" fill="#0f766e"/><text x="290.0" y="330.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">7</text><g transform="translate(379.0,352.0) scale(0.95)"><path d="M-5 -20 L5 -20 L5 -12 Q12 -8 12 0 L12 18 L-12 18 L-12 0 Q-12 -8 -5 -12 Z" fill="#c2410c" fill-opacity="0.85" stroke="#7c2d12" stroke-width="1.5"/><rect x="-9" y="0" width="18" height="10" fill="#fef3c7"/></g><text x="379.0" y="390.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Ageing</text><text x="379.0" y="407.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Aged in clay jars</text><text x="379.0" y="422.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">in the sun, then</text><text x="379.0" y="438.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">bottled</text><line x1="271.0" y1="385.0" x2="242.0" y2="385.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/><rect x="28.0" y="310.0" width="210" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="44.0" cy="326.0" r="12" fill="#0f766e"/><text x="44.0" y="330.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">8</text><g transform="translate(133.0,352.0) scale(0.95)"><rect x="-20" y="-10" width="26" height="18" fill="#2a78d6" rx="2"/><path d="M6 -4 L15 -4 L20 2 L20 8 L6 8 Z" fill="#1d4ed8"/><circle cx="-12" cy="10" r="4.5" fill="#1f2937"/><circle cx="12" cy="10" r="4.5" fill="#1f2937"/></g><text x="133.0" y="390.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Distribution</text><text x="133.0" y="407.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Labelled and sent to</text><text x="133.0" y="422.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">shops and restaurants</text><line x1="871.0" y1="463.0" x2="871.0" y2="500.0" stroke="#1f2937" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/><rect x="771.0" y="504.0" width="200" height="66" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4" stroke-dasharray="6 4"/><text x="871.0" y="524.0" font-size="12" fill="#9a3412" text-anchor="middle" font-weight="bold">By-product</text><text x="871.0" y="542.0" font-size="11.8" fill="#1f2937" text-anchor="middle" font-weight="normal">Fish residue → animal</text><text x="871.0" y="557.0" font-size="11.8" fill="#1f2937" text-anchor="middle" font-weight="normal">feed and fertiliser</text></svg>