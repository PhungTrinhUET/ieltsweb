<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 325" width="860" height="325" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title>Average hours per week spent by teenagers on each activity</title><rect width="860" height="325" fill="#ffffff"/><text x="430.0" y="30.0" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Average hours per week spent by teenagers on each activity</text><rect x="30" y="58" width="800" height="33" fill="#e8f0fb"/><text x="344.8" y="79.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">2005</text><text x="668.3" y="79.0" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">2025</text><text x="42.0" y="112.5" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold">Homework</text><text x="344.8" y="112.5" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal">9.5</text><text x="668.3" y="112.5" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal">7.0</text><line x1="30" y1="125.0" x2="830" y2="125.0" stroke="#dcdbd6"/><rect x="30" y="125.0" width="800" height="34.0" fill="#f6f6f3"/><text x="42.0" y="146.5" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold">Sport</text><text x="344.8" y="146.5" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal">6.0</text><text x="668.3" y="146.5" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal">4.5</text><line x1="30" y1="159.0" x2="830" y2="159.0" stroke="#dcdbd6"/><text x="42.0" y="180.5" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold">Online gaming</text><text x="344.8" y="180.5" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal">3.0</text><text x="668.3" y="180.5" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="normal">8.5</text><line x1="30" y1="193.0" x2="830" y2="193.0" stroke="#dcdbd6"/><rect x="30" y="193.0" width="800" height="34.0" fill="#f6f6f3"/