<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 650" width="1040" height="650" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title>How old smartphones are recycled</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2937"/></marker><pattern id="crop" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="10" height="10" fill="#ecfccb"/><line x1="0" y1="0" x2="0" y2="10" stroke="#a3e635" stroke-width="3"/></pattern><pattern id="paving" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#f3e8d2"/><path d="M0 0 H14 M0 7 H14 M7 0 V7 M0 7 V14 M14 7 V14" stroke="#e2d2b1" stroke-width="1"/></pattern><pattern id="water" width="24" height="10" patternUnits="userSpaceOnUse"><rect width="24" height="10" fill="#9cc9f5"/><path d="M0 6 q6 -4 12 0 t12 0" fill="none" stroke="#7fb5ea" stroke-width="1.2"/></pattern><pattern id="grass" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#d9f2c4"/><path d="M3 9 l1 -3 M8 5 l1 -3" stroke="#a7d98a" stroke-width="1.2"/></pattern><pattern id="sand" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f4e4b8"/><circle cx="3" cy="3" r="0.8" fill="#d9c189"/><circle cx="8" cy="7" r="0.8" fill="#d9c189"/></pattern></defs><rect width="1040" height="650" fill="#ffffff"/><text x="520.0" y="40.0" font-size="21" fill="#1f2937" text-anchor="middle" font-weight="bold">How old smartphones are recycled</text><rect x="40.0" y="90.0" width="200" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="56.0" cy="106.0" r="12" fill="#0f766e"/><text x="56.0" y="110.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">1</text><g transform="translate(140.0,132.0) scale(0.95)"><rect x="-11" y="-19" width="22" height="38" rx="4" fill="#1f2937"/><rect x="-8" y="-14" width="16" height="26" fill="#93c5fd"/><circle cy="15.5" r="1.6" fill="#9ca3af"/></g><text x="140.0" y="170.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Collection</text><text x="140.0" y="187.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Old phones handed in</text><text x="140.0" y="202.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">at shops and</text><text x="140.0" y="218.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">drop-off boxes</text><rect x="290.0" y="90.0" width="200" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="306.0" cy="106.0" r="12" fill="#0f766e"/><text x="306.0" y="110.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">2</text><g transform="translate(390.0,132.0) scale(0.95)"><circle r="16" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><path d="M-7 0 L-2 6 L8 -6" fill="none" stroke="#16a34a" stroke-width="3"/></g><text x="390.0" y="170.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Testing</text><text x="390.0" y="187.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Personal data wiped;</text><text x="390.0" y="202.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">phones tested</text><text x="390.0" y="218.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">and sorted</text><rect x="540.0" y="90.0" width="200" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="556.0" cy="106.0" r="12" fill="#0f766e"/><text x="556.0" y="110.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">3</text><g transform="translate(640.0,132.0) scale(0.95)"><path d="M-16 -10 L6 -10 L18 0 L6 10 L-16 10 Z" fill="#fde68a" stroke="#a16207" stroke-width="1.5"/><circle cx="8" cy="0" r="2.5" fill="#a16207"/></g><text x="640.0" y="170.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Refurbishing</text><text x="640.0" y="187.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Working phones</text><text x="640.0" y="202.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">repaired, cleaned</text><text x="640.0" y="218.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">and resold</text><rect x="290.0" y="300.0" width="200" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="306.0" cy="316.0" r="12" fill="#0f766e"/><text x="306.0" y="320.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">4</text><g transform="translate(390.0,342.0) scale(0.95)"><rect x="-16" y="-9" width="28" height="18" rx="3" fill="#fff" stroke="#374151" stroke-width="1.8"/><rect x="12" y="-4" width="4" height="8" fill="#374151"/><rect x="-13" y="-6" width="14" height="12" fill="#22c55e"/></g><text x="390.0" y="380.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Battery removal</text><text x="390.0" y="397.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Batteries taken out</text><text x="390.0" y="412.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">and sent to a</text><text x="390.0" y="428.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">specialist plant</text><rect x="540.0" y="300.0" width="200" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="556.0" cy="316.0" r="12" fill="#0f766e"/><text x="556.0" y="320.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">5</text><g transform="translate(640.0,342.0) scale(0.95)"><polygon points="17.0,0.0 11.1,4.6 12.0,12.0 4.6,11.1 0.0,17.0 -4.6,11.1 -12.0,12.0 -11.1,4.6 -17.0,0.0 -11.1,-4.6 -12.0,-12.0 -4.6,-11.1 -0.0,-17.0 4.6,-11.1 12.0,-12.0 11.1,-4.6" fill="#9ca3af" stroke="#4b5563" stroke-width="1.2"/><circle r="5" fill="#fff" stroke="#4b5563"/></g><text x="640.0" y="380.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Shredding</text><text x="640.0" y="397.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Phones broken into</text><text x="640.0" y="412.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">small pieces</text><rect x="790.0" y="300.0" width="200" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="806.0" cy="316.0" r="12" fill="#0f766e"/><text x="806.0" y="320.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">6</text><g transform="translate(890.0,342.0) scale(0.95)"><path d="M-14 -16 L-14 4 A14 14 0 0 0 14 4 L14 -16 L6 -16 L6 4 A6 6 0 0 1 -6 4 L-6 -16 Z" fill="#e34948" stroke="#991b1b" stroke-width="1.5"/><rect x="-14" y="-16" width="8" height="6" fill="#d1d5db"/><rect x="6" y="-16" width="8" height="6" fill="#d1d5db"/></g><text x="890.0" y="380.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Separation</text><text x="890.0" y="397.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Metals and plastics</text><text x="890.0" y="412.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">separated by magnets</text><text x="890.0" y="428.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">and air jets</text><rect x="790.0" y="475.0" width="200" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="806.0" cy="491.0" r="12" fill="#0f766e"/><text x="806.0" y="495.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">7</text><g transform="translate(890.0,517.0) scale(0.95)"><path d="M0 -20 C 10 -8, 14 0, 12 8 A12 12 0 0 1 -12 8 C -14 0, -8 -6, -4 -10 C -4 -4, 0 -2, 2 -4 C 4 -10, 2 -14, 0 -20 Z" fill="#f97316" stroke="#c2