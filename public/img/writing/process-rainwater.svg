<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 590" width="980" height="590" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title>A household rainwater harvesting system</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2937"/></marker><pattern id="crop" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="10" height="10" fill="#ecfccb"/><line x1="0" y1="0" x2="0" y2="10" stroke="#a3e635" stroke-width="3"/></pattern><pattern id="paving" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#f3e8d2"/><path d="M0 0 H14 M0 7 H14 M7 0 V7 M0 7 V14 M14 7 V14" stroke="#e2d2b1" stroke-width="1"/></pattern><pattern id="water" width="24" height="10" patternUnits="userSpaceOnUse"><rect width="24" height="10" fill="#9cc9f5"/><path d="M0 6 q6 -4 12 0 t12 0" fill="none" stroke="#7fb5ea" stroke-width="1.2"/></pattern><pattern id="grass" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#d9f2c4"/><path d="M3 9 l1 -3 M8 5 l1 -3" stroke="#a7d98a" stroke-width="1.2"/></pattern><pattern id="sand" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f4e4b8"/><circle cx="3" cy="3" r="0.8" fill="#d9c189"/><circle cx="8" cy="7" r="0.8" fill="#d9c189"/></pattern></defs><rect width="980" height="590" fill="#ffffff"/><text x="490.0" y="40.0" font-size="21" fill="#1f2937" text-anchor="middle" font-weight="bold">A household rainwater harvesting system</text><rect x="28.0" y="80.0" width="210" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="44.0" cy="96.0" r="12" fill="#0f766e"/><text x="44.0" y="100.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">1</text><g transform="translate(133.0,122.0) scale(0.95)"><path d="M-16 6 a8 8 0 0 1 2 -15 a10 10 0 0 1 18 -3 a8 8 0 0 1 12 9 a6 6 0 0 1 0 9 Z" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/><line x1="-8" y1="10" x2="-12" y2="20" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><line x1="0" y1="10" x2="-4" y2="20" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><line x1="8" y1="10" x2="4" y2="20" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/></g><text x="133.0" y="160.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Rainfall</text><text x="133.0" y="177.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Rain falls on</text><text x="133.0" y="192.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">the roof</text><line x1="241.0" y1="155.0" x2="270.0" y2="155.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/><rect x="274.0" y="80.0" width="210" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="290.0" cy="96.0" r="12" fill="#0f766e"/><text x="290.0" y="100.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">2</text><g transform="translate(379.0,122.0) scale(0.95)"><path d="M-18 -2 L0 -18 L18 -2" fill="none" stroke="#b45309" stroke-width="3"/><rect x="-13" y="-4" width="26" height="20" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/><rect x="-4" y="5" width="8" height="11" fill="#b45309"/></g><text x="379.0" y="160.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Collection</text><text x="379.0" y="177.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Gutters collect water;</text><text x="379.0" y="192.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">it flows down</text><text x="379.0" y="208.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">a downpipe</text><line x1="487.0" y1="155.0" x2="516.0" y2="155.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/><rect x="520.0" y="80.0" width="210" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="536.0" cy="96.0" r="12" fill="#0f766e"/><text x="536.0" y="100.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">3</text><g transform="translate(625.0,122.0) scale(0.95)"><path d="M-18 -14 L18 -14 L4 4 L4 16 L-4 16 L-4 4 Z" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/><line x1="-12" y1="-8" x2="12" y2="-8" stroke="#9ca3af" stroke-dasharray="2 2"/></g><text x="625.0" y="160.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">First flush</text><text x="625.0" y="177.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Diverter removes the</text><text x="625.0" y="192.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">first, dirtiest water</text><text x="625.0" y="208.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">from the roof</text><line x1="733.0" y1="155.0" x2="762.0" y2="155.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/><rect x="766.0" y="80.0" width="210" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="782.0" cy="96.0" r="12" fill="#0f766e"/><text x="782.0" y="100.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">4</text><g transform="translate(871.0,122.0) scale(0.95)"><path d="M-16 14 C -16 -6, 0 -18, 16 -16 C 16 4, 2 16, -16 14 Z" fill="#4ade80" stroke="#15803d" stroke-width="1.5"/><path d="M-16 14 L8 -8" stroke="#15803d" stroke-width="1.5"/></g><text x="871.0" y="160.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Filtering</text><text x="871.0" y="177.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Mesh filter removes</text><text x="871.0" y="192.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">leaves and debris</text><line x1="871.0" y1="233.0" x2="871.0" y2="306.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/><rect x="766.0" y="310.0" width="210" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="782.0" cy="326.0" r="12" fill="#0f766e"/><text x="782.0" y="330.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">5</text><g transform="translate(871.0,352.0) scale(0.95)"><ellipse cx="0" cy="-12" rx="16" ry="5" fill="#bfdbfe" stroke="#2a78d6" stroke-width="1.5"/><path d="M-16 -12 L-16 12 A16 5 0 0 0 16 12 L16 -12" fill="#bfdbfe" stroke="#2a78d6" stroke-width="1.5"/><path d="M-16 2 A16 5 0 0 0 16 2" fill="none" stroke="#2a78d6" stroke-width="1"/></g><text x="871.0" y="390.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Storage</text><text x="871.0" y="407.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Water stored in an</text><text x="871.0" y="422.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">underground tank</text><line x1="763.0" y1="385.0" x2="734.0" y2="385.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/><rect x="520.0" y="310.0" width="210" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="536.0" cy="326.0" r="12" fill="#0f766e"/><text x="536.0" y="330.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">6</text><g transform="translate(625.0,352.0) scale(0.95)"><circle r="14" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/><path d="M-6 -6 A8 8 0 1 1 -8 3" fill="none" stroke="#2a78d6" stroke-width="2.4" marker-end="url(#ar)"/></g><text x="625.0" y="390.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Pumping</text><text x="625.0" y="407.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Pump sends water</text><text x="625.0" y="422.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">into the house</text><line x1="517.0" y1="385.0" x2="488.0" y2="385.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/><rect x="274.0" y="310.0" width="210" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="290.0" cy="326.0" r="12" fill="#0f766e"/><text x="290.0" y="330.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">7</text><g transform="translate(379.0,352.0) scale(0.95)"><rect x="-16" y="-14" width="20" height="8" rx="2" fill="#9ca3af"/><rect x="2" y="-14" width="8" height="16" rx="2" fill="#9ca3af"/><rect x="-10" y="-20" width="8" height="6" fill="#6b7280"/><path d="M6 6 C 9 10, 11 13, 11 15 A5 5 0 0 1 1 15 C 1 13, 3 10, 6 6 Z" fill="#5aa9f0"/></g><text x="379.0" y="390.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Use</text><text x="379.0" y="407.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Toilets, washing</text><text x="379.0" y="422.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">machine and garden</text><line x1="871.0" y1="463.0" x2="871.0" y2="500.0" stroke="#1f2937" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/><rect x="771.0" y="504.0" width="200" height="66" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4" stroke-dasharray="6 4"/><text x="871.0" y="524.0" font-size="12" fill="#9a3412" text-anchor="middle" font-weight="bold">When the tank is full</text><text x="871.0" y="542.0" font-size="11.8" fill="#1f2937" text-anchor="middle" font-weight="normal">an overflow pipe carries</text><text x="871.0" y="557.0" font-size="11.8" fill="#1f2937" text-anchor="middle" font-weight="normal">water to the drain</text></svg>