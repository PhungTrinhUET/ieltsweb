<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title>Turning food waste into energy and fertiliser</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2937"/></marker><pattern id="crop" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="10" height="10" fill="#ecfccb"/><line x1="0" y1="0" x2="0" y2="10" stroke="#a3e635" stroke-width="3"/></pattern><pattern id="paving" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#f3e8d2"/><path d="M0 0 H14 M0 7 H14 M7 0 V7 M0 7 V14 M14 7 V14" stroke="#e2d2b1" stroke-width="1"/></pattern><pattern id="water" width="24" height="10" patternUnits="userSpaceOnUse"><rect width="24" height="10" fill="#9cc9f5"/><path d="M0 6 q6 -4 12 0 t12 0" fill="none" stroke="#7fb5ea" stroke-width="1.2"/></pattern><pattern id="grass" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#d9f2c4"/><path d="M3 9 l1 -3 M8 5 l1 -3" stroke="#a7d98a" stroke-width="1.2"/></pattern><pattern id="sand" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f4e4b8"/><circle cx="3" cy="3" r="0.8" fill="#d9c189"/><circle cx="8" cy="7" r="0.8" fill="#d9c189"/></pattern></defs><rect width="1000" height="640" fill="#ffffff"/><text x="500.0" y="40.0" font-size="21" fill="#1f2937" text-anchor="middle" font-weight="bold">Turning food waste into energy and fertiliser</text><rect x="26.0" y="86.0" width="205" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="42.0" cy="102.0" r="12" fill="#0f766e"/><text x="42.0" y="106.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">1</text><g transform="translate(128.5,128.0) scale(0.95)"><path d="M-13 -10 L13 -10 L10 18 L-10 18 Z" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/><rect x="-16" y="-16" width="32" height="6" rx="2" fill="#15803d"/><path d="M-4 0 q4 -6 8 0 q-4 6 -8 0" fill="#fff" opacity="0.8"/></g><text x="128.5" y="166.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Collection</text><text x="128.5" y="183.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Food waste collected</text><text x="128.5" y="198.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">in caddies from</text><text x="128.5" y="214.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">homes each week</text><line x1="234.0" y1="161.0" x2="266.0" y2="161.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/><rect x="270.0" y="86.0" width="205" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="286.0" cy="102.0" r="12" fill="#0f766e"/><text x="286.0" y="106.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">2</text><g transform="translate(372.5,128.0) scale(0.95)"><rect x="-20" y="-10" width="26" height="18" fill="#2a78d6" rx="2"/><path d="M6 -4 L15 -4 L20 2 L20 8 L6 8 Z" fill="#1d4ed8"/><circle cx="-12" cy="10" r="4.5" fill="#1f2937"/><circle cx="12" cy="10" r="4.5" fill="#1f2937"/></g><text x="372.5" y="166.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Transport</text><text x="372.5" y="183.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Taken by lorry to</text><text x="372.5" y="198.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">the processing plant</text><line x1="478.0" y1="161.0" x2="510.0" y2="161.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/><rect x="514.0" y="86.0" width="205" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="530.0" cy="102.0" r="12" fill="#0f766e"/><text x="530.0" y="106.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">3</text><g transform="translate(616.5,128.0) scale(0.95)"><rect x="-14" y="-8" width="28" height="22" rx="6" fill="#fcd34d" stroke="#b45309" stroke-width="1.5"/><path d="M-8 -8 L-8 -16 M0 -8 L0 -18 M8 -8 L8 -16" stroke="#b45309" stroke-width="3" stroke-linecap="round"/></g><text x="616.5" y="166.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Sorting</text><text x="616.5" y="183.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Plastic bags and</text><text x="616.5" y="198.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">packaging removed</text><line x1="722.0" y1="161.0" x2="754.0" y2="161.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/><rect x="758.0" y="86.0" width="205" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="774.0" cy="102.0" r="12" fill="#0f766e"/><text x="774.0" y="106.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">4</text><g transform="translate(860.5,128.0) scale(0.95)"><polygon points="17.0,0.0 11.1,4.6 12.0,12.0 4.6,11.1 0.0,17.0 -4.6,11.1 -12.0,12.0 -11.1,4.6 -17.0,0.0 -11.1,-4.6 -12.0,-12.0 -4.6,-11.1 -0.0,-17.0 4.6,-11.1 12.0,-12.0 11.1,-4.6" fill="#9ca3af" stroke="#4b5563" stroke-width="1.2"/><circle r="5" fill="#fff" stroke="#4b5563"/></g><text x="860.5" y="166.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Shredding</text><text x="860.5" y="183.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Waste shredded</text><text x="860.5" y="198.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">into a thick pulp</text><rect x="758.0" y="300.0" width="205" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="774.0" cy="316.0" r="12" fill="#0f766e"/><text x="774.0" y="320.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">5</text><g transform="translate(860.5,342.0) scale(0.95)"><path d="M-20 16 L-20 0 A20 18 0 0 1 20 0 L20 16 Z" fill="#a7f3d0" stroke="#047857" stroke-width="1.5"/><line x1="-20" y1="6" x2="20" y2="6" stroke="#047857"/><rect x="-3" y="-24" width="6" height="8" fill="#6b7280"/></g><text x="860.5" y="380.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Digestion</text><text x="860.5" y="397.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Broken down without</text><text x="860.5" y="412.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">oxygen in a digester</text><text x="860.5" y="428.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">for 3–4 weeks</text><line x1="860.5" y1="239.0" x2="860.5" y2="296.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/><rect x="330.0" y="270.0" width="205" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="346.0" cy="286.0" r="12" fill="#0f766e"/><text x="346.0" y="290.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">6</text><g transform="translate(432.5,312.0) scale(0.95)"><path d="M4 -20 L-10 2 L0 2 L-4 20 L12 -4 L2 -4 Z" fill="#facc15" stroke="#a16207" stroke-width="1.5"/></g><text x="432.5" y="350.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Biogas</text><text x="432.5" y="367.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Methane burned in a</text><text x="432.5" y="382.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">generator to make</text><text x="432.5" y="398.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">electricity and heat</text><rect x="330.0" y="460.0" width="205" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/><circle cx="346.0" cy="476.0" r="12" fill="#0f766e"/><text x="346.0" y="480.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">7</text><g transform="translate(432.5,502.0) scale(0.95)"><path d="M-16 14 C -16 -6, 0 -18, 16 -16 C 16 4, 2 16, -16 14 Z" fill="#4ade80" stroke="#15803d" stroke-width="1.5"/><path d="M-16 14 L8 -8" stroke="#15803d" stroke-width="1.5"/></g><text x="432.5" y="540.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Digestate</text><text x="432.5" y="557.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Solid remains dried</text><text x="432.5" y="572.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">and sold to farms</text><text x="432.5" y="588.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">as fertiliser</text><line x1="755.0" y1="355.0" x2="539.0" y2="345.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/><line x1="755.0" y1="400.0" x2="539.0" y2="525.0" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/><text x="708.0" y="336.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="bold">gas</text><text x="704.0" y="450.0" font-size="11" fill="#4b5563" text-anchor="middle" font-weight="bold">solids</text></svg>