<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 740" width="980" height="740" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif"><title>The life cycle of a sea turtle</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2937"/></marker><pattern id="crop" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="10" height="10" fill="#ecfccb"/><line x1="0" y1="0" x2="0" y2="10" stroke="#a3e635" stroke-width="3"/></pattern><pattern id="paving" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#f3e8d2"/><path d="M0 0 H14 M0 7 H14 M7 0 V7 M0 7 V14 M14 7 V14" stroke="#e2d2b1" stroke-width="1"/></pattern><pattern id="water" width="24" height="10" patternUnits="userSpaceOnUse"><rect width="24" height="10" fill="#9cc9f5"/><path d="M0 6 q6 -4 12 0 t12 0" fill="none" stroke="#7fb5ea" stroke-width="1.2"/></pattern><pattern id="grass" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#d9f2c4"/><path d="M3 9 l1 -3 M8 5 l1 -3" stroke="#a7d98a" stroke-width="1.2"/></pattern><pattern id="sand" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#f4e4b8"/><circle cx="3" cy="3" r="0.8" fill="#d9c189"/><circle cx="8" cy="7" r="0.8" fill="#d9c189"/></pattern></defs><rect width="980" height="740" fill="#ffffff"/><text x="490.0" y="34.0" font-size="21" fill="#1f2937" text-anchor="middle" font-weight="bold">The life cycle of a sea turtle</text><path d="M563.0 154.1 Q623.6 158.7 657.8 208.8" fill="none" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ar)"/><path d="M730.8 335.2 Q757.1 390.0 730.8 444.8" fill="none" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ar)"/><path d="M657.8 571.2 Q623.6 621.3 563.0 625.9" fill="none" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ar)"/><path d="M417.0 625.9 Q356.4 621.3 322.2 571.2" fill="none" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ar)"/><path d="M249.2 444.8 Q222.9 390.0 249.2 335.2" fill="none" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ar)"/><path d="M322.2 208.8 Q356.4 158.7 417.0 154.1" fill="none" stroke="#1f2937" stroke-width="2.2" marker-end="url(#ar)"/><rect x="392.0" y="67.0" width="196" height="142" rx="12" fill="#f0fdf4" stroke="#94a3b8" stroke-width="1.4"/><circle cx="408.0" cy="83.0" r="12" fill="#0f766e"/><text x="408.0" y="87.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">1</text><g transform="translate(490.0,109.0) scale(0.95)"><ellipse cx="-17" cy="-9" rx="5" ry="3" fill="#4d7c0f" transform="rotate(-30 -17 -9)"/><ellipse cx="-17" cy="9" rx="5" ry="3" fill="#4d7c0f" transform="rotate(30 -17 9)"/><ellipse cx="12" cy="-12" rx="8" ry="3.5" fill="#4d7c0f" transform="rotate(-40 12 -12)"/><ellipse cx="12" cy="12" rx="8" ry="3.5" fill="#4d7c0f" transform="rotate(40 12 12)"/><circle cx="21" cy="0" r="5" fill="#65a30d"/><ellipse rx="16" ry="12" fill="#3f6212"/><path d="M-8 -6 L0 -9 L8 -6 L8 6 L0 9 L-8 6 Z" fill="none" stroke="#a3e635" stroke-width="1.3"/><line x1="0" y1="-12" x2="0" y2="12" stroke="#a3e635" stroke-width="1"/></g><text x="490.0" y="147.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Nesting</text><text x="490.0" y="164.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Female returns at night</text><text x="490.0" y="179.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">to the beach where</text><text x="490.0" y="195.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">she hatched</text><rect x="610.2" y="193.0" width="196" height="142" rx="12" fill="#f0fdf4" stroke="#94a3b8" stroke-width="1.4"/><circle cx="626.2" cy="209.0" r="12" fill="#0f766e"/><text x="626.2" y="213.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">2</text><g transform="translate(708.2,235.0) scale(0.95)"><ellipse cx="0" cy="10" rx="20" ry="6" fill="#d6b77e"/><circle cx="-10" cy="4" r="6" fill="#fffaf0" stroke="#c8b08a" stroke-width="1.2"/><circle cx="0" cy="2" r="6" fill="#fffaf0" stroke="#c8b08a" stroke-width="1.2"/><circle cx="10" cy="4" r="6" fill="#fffaf0" stroke="#c8b08a" stroke-width="1.2"/><circle cx="-5" cy="-6" r="6" fill="#fffaf0" stroke="#c8b08a" stroke-width="1.2"/><circle cx="5" cy="-6" r="6" fill="#fffaf0" stroke="#c8b08a" stroke-width="1.2"/></g><text x="708.2" y="273.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Egg laying</text><text x="708.2" y="290.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Lays about 100 eggs</text><text x="708.2" y="305.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">in a nest in the sand</text><rect x="610.2" y="445.0" width="196" height="142" rx="12" fill="#f0fdf4" stroke="#94a3b8" stroke-width="1.4"/><circle cx="626.2" cy="461.0" r="12" fill="#0f766e"/><text x="626.2" y="465.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">3</text><g transform="translate(708.2,487.0) scale(0.95)"><rect x="-4" y="-18" width="8" height="26" rx="4" fill="#fff" stroke="#6b7280" stroke-width="1.5"/><circle cy="12" r="7" fill="#e34948" stroke="#6b7280" stroke-width="1.5"/><rect x="-2" y="-6" width="4" height="16" fill="#e34948"/></g><text x="708.2" y="525.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Incubation</text><text x="708.2" y="542.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Eggs warmed by the sand</text><text x="708.2" y="557.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">for about 60 days</text><text x="708.2" y="573.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">(warmer → more females)</text><rect x="392.0" y="571.0" width="196" height="142" rx="12" fill="#f0fdf4" stroke="#94a3b8" stroke-width="1.4"/><circle cx="408.0" cy="587.0" r="12" fill="#0f766e"/><text x="408.0" y="591.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">4</text><g transform="translate(490.0,613.0) scale(0.95)"><path d="M4 -16 A16 16 0 1 0 12 12 A12 12 0 1 1 4 -16 Z" fill="#fde68a" stroke="#d4a017" stroke-width="1.5"/></g><text x="490.0" y="651.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Hatching</text><text x="490.0" y="668.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Hatchlings dig out</text><text x="490.0" y="683.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">at night and crawl</text><text x="490.0" y="699.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">to the sea</text><rect x="173.8" y="445.0" width="196" height="142" rx="12" fill="#f0fdf4" stroke="#94a3b8" stroke-width="1.4"/><circle cx="189.8" cy="461.0" r="12" fill="#0f766e"/><text x="189.8" y="465.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">5</text><g transform="translate(271.8,487.0) scale(0.95)"><path d="M-20 0 q5 -6 10 0 t10 0 t10 0 t10 0" fill="none" stroke="#2a78d6" stroke-width="2.6"/><path d="M-20 9 q5 -6 10 0 t10 0 t10 0 t10 0" fill="none" stroke="#7fb5ea" stroke-width="2.2"/></g><text x="271.8" y="525.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Ocean years</text><text x="271.8" y="542.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Young turtles drift</text><text x="271.8" y="557.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">in ocean currents</text><text x="271.8" y="573.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">for several years</text><rect x="173.8" y="193.0" width="196" height="142" rx="12" fill="#f0fdf4" stroke="#94a3b8" stroke-width="1.4"/><circle cx="189.8" cy="209.0" r="12" fill="#0f766e"/><text x="189.8" y="213.5" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="bold">6</text><g transform="translate(271.8,235.0) scale(0.95)"><ellipse cx="-17" cy="-9" rx="5" ry="3" fill="#4d7c0f" transform="rotate(-30 -17 -9)"/><ellipse cx="-17" cy="9" rx="5" ry="3" fill="#4d7c0f" transform="rotate(30 -17 9)"/><ellipse cx="12" cy="-12" rx="8" ry="3.5" fill="#4d7c0f" transform="rotate(-40 12 -12)"/><ellipse cx="12" cy="12" rx="8" ry="3.5" fill="#4d7c0f" transform="rotate(40 12 12)"/><circle cx="21" cy="0" r="5" fill="#65a30d"/><ellipse rx="16" ry="12" fill="#3f6212"/><path d="M-8 -6 L0 -9 L8 -6 L8 6 L0 9 L-8 6 Z" fill="none" stroke="#a3e635" stroke-width="1.3"/><line x1="0" y1="-12" x2="0" y2="12" stroke="#a3e635" stroke-width="1"/></g><text x="271.8" y="273.0" font-size="13.5" fill="#1f2937" text-anchor="middle" font-weight="bold">Maturity</text><text x="271.8" y="290.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">Adults mature at</text><text x="271.8" y="305.5" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">20–30 years and swim</text><text x="271.8" y="321.0" font-size="11.8" fill="#4b5563" text-anchor="middle" font-weight="normal">back to their home beach</text><text x="490.0" y="380.0" font-size="15" fill="#0f766e" text-anchor="middle" font-weight="bold">Sea turtle</text><text x="490.0" y="400.0" font-size="12.5" fill="#4b5563" text-anchor="middle" font-weight="normal">life cycle</text></svg>